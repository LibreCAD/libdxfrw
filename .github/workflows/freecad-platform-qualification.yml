name: FreeCAD native platform qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-freecad:
    name: FreeCAD 1.1.3 / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify pinned FreeCAD release
        shell: bash
        run: |
          set -euo pipefail
          asset=FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          url="https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/${asset}"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' \
            3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef \
            "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && ./"$asset" --appimage-extract)
          mapfile -t commands < <(find "$RUNNER_TEMP/squashfs-root" \
            \( -type f -o -type l \) -iname freecadcmd -print)
          if [[ "${#commands[@]}" -ne 1 ]]; then
            printf 'Expected one FreeCADCmd in the pinned AppImage, found %s\n' "${#commands[@]}" >&2
            exit 1
          fi
          printf 'cmd=%s\n' "${commands[0]}" >> "$GITHUB_OUTPUT"
        id: freecad

      - name: Build, install, and qualify the Linux handoff
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBDXFRW_BUILD_DOC=OFF \
            -DLIBDXFRW_BUILD_DWG2DXF=ON \
            -DLIBDXFRW_BUILD_TESTS=ON
          cmake --build build --parallel 2 --target dwg2dxf
          cmake --install build --prefix "$RUNNER_TEMP/libdxfrw install"
          installed="$RUNNER_TEMP/libdxfrw install/bin/dwg2dxf"
          cmake -S . -B build \
            -DLIBDXFRW_ENABLE_FREECAD_TRACKED_AC1027_LINE_CONTROL=ON \
            -DLIBDXFRW_FREECADCMD_EXECUTABLE='${{ steps.freecad.outputs.cmd }}' \
            -DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE="$installed"
          cmake --build build --parallel 2 --target dwg2dxf
          ctest --test-dir build \
            -R '^dwg2dxf_freecad_tracked_ac1027_line_' \
            --output-on-failure --verbose

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  windows-freecad:
    name: FreeCAD 1.1.3 / Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify, and unpack pinned FreeCAD release
        id: freecad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'FreeCAD_1.1.3-Windows-x86_64-py311.7z'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FreeCAD archive SHA-256 mismatch: $actual != $expected"
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found: $sevenZip" }
          $destination = Join-Path $env:RUNNER_TEMP 'FreeCAD 1.1.3'
          New-Item -ItemType Directory -Path $destination | Out-Null
          & $sevenZip x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }
          $commands = @(Get-ChildItem -Path $destination -Filter FreeCADCmd.exe -File -Recurse)
          if ($commands.Count -ne 1) {
            throw "Expected one FreeCADCmd.exe in the pinned archive, found $($commands.Count)"
          }
          "cmd=$($commands[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build, install, and qualify the Windows handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DLIBDXFRW_BUILD_DOC=OFF `
            -DLIBDXFRW_BUILD_DWG2DXF=ON `
            -DLIBDXFRW_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed: $LASTEXITCODE" }
          $prefix = Join-Path $env:RUNNER_TEMP 'libdxfrw install'
          cmake --install build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed: $LASTEXITCODE" }
          $installed = Join-Path $prefix 'bin/dwg2dxf.exe'
          cmake -S . -B build `
            -DLIBDXFRW_ENABLE_FREECAD_TRACKED_AC1027_LINE_CONTROL=ON `
            "-DLIBDXFRW_FREECADCMD_EXECUTABLE=${{ steps.freecad.outputs.cmd }}" `
            "-DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE=$installed"
          if ($LASTEXITCODE -ne 0) { throw "CMake reconfigure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf
          if ($LASTEXITCODE -ne 0) { throw "CMake rebuild failed: $LASTEXITCODE" }
          ctest --test-dir build -C Release `
            -R '^dwg2dxf_freecad_tracked_ac1027_line_' `
            --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw "FreeCAD CTest qualification failed: $LASTEXITCODE" }

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
