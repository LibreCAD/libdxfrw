name: FreeCAD native platform qualification

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Build and probe the pinned downstream FreeCAD candidate
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'codex/freecad-platform-qualification-*'

permissions:
  contents: read

jobs:
  linux-freecad:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.candidate }}
    name: FreeCAD 1.1.4 / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned optional legacy DXF importer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yorikvanhavre/Draft-dxf-importer
          ref: e060ef0d8fe7143c2e0ce34734b686ba073f3cc1
          path: _freecad_legacy_addon
          persist-credentials: false

      - name: Download and verify pinned FreeCAD release
        shell: bash
        run: |
          set -euo pipefail
          asset=FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          url="https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/${asset}"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' \
            f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434 \
            "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && ./"$asset" --appimage-extract)
          mapfile -t commands < <(find "$RUNNER_TEMP/squashfs-root" \
            \( -type f -o -type l \) -iname freecadcmd -print)
          if [[ "${#commands[@]}" -ne 1 ]]; then
            printf 'Expected one FreeCADCmd in the pinned AppImage, found %s\n' "${#commands[@]}" >&2
            exit 1
          fi
          printf 'cmd=%s\n' "${commands[0]}" >> "$GITHUB_OUTPUT"
        id: freecad

      - name: Build, install, and qualify the Linux handoff
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          addon="$GITHUB_WORKSPACE/_freecad_legacy_addon"
          test "$(git -C "$addon" rev-parse HEAD)" = e060ef0d8fe7143c2e0ce34734b686ba073f3cc1
          git -C "$addon" diff --quiet HEAD -- dxfReader.py dxfLibrary.py dxfColorMap.py dxfImportObjects.py
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBDXFRW_BUILD_DOC=OFF \
            -DLIBDXFRW_BUILD_DWG2DXF=ON \
            -DLIBDXFRW_BUILD_TESTS=ON
          cmake --build build --parallel 2 --target dwg2dxf libdxfrw_dwg_local_roundtrip
          cmake --install build --prefix "$RUNNER_TEMP/libdxfrw install"
          installed="$RUNNER_TEMP/libdxfrw install/bin/dwg2dxf"
          cmake -S . -B build \
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_LINE_CONTROL=ON \
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_PRIMITIVE_CONTROL=ON \
            -DLIBDXFRW_ENABLE_FREECAD_LEGACY_POLYFACE_CONTROL=ON \
            -DLIBDXFRW_FREECAD_LEGACY_DXF_ADDON_DIR="$addon" \
            -DLIBDXFRW_FREECADCMD_EXECUTABLE='${{ steps.freecad.outputs.cmd }}' \
            -DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE="$installed"
          cmake --build build --parallel 2 --target dwg2dxf
          ctest --test-dir build \
            -R '^dwg2dxf_freecad_(generated_ac1021_(line|primitives)_.*|generated_ac1024_primitives_.*|generated_ac1032_primitives_.*|legacy_polyface(_ac1024|_ac1032)?_(open|insert)|cli_compat|installed_cli_compat)$' \
            --output-on-failure --verbose

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  windows-freecad:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.candidate }}
    name: FreeCAD 1.1.4 / Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned optional legacy DXF importer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yorikvanhavre/Draft-dxf-importer
          ref: e060ef0d8fe7143c2e0ce34734b686ba073f3cc1
          path: _freecad_legacy_addon
          persist-credentials: false

      - name: Download, verify, and unpack pinned FreeCAD release
        id: freecad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'FreeCAD_1.1.4-Windows-x86_64-py311.7z'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '4828741fc91ee37fafcdb97a1abacb18b04ba451ac4372d9ff7a7349b36f4d6d'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FreeCAD archive SHA-256 mismatch: $actual != $expected"
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found: $sevenZip" }
          $destination = Join-Path $env:RUNNER_TEMP 'FreeCAD 1.1.4'
          New-Item -ItemType Directory -Path $destination | Out-Null
          & $sevenZip x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }
          # The pinned archive also contains a root launcher. Use the actual
          # console executable in bin, whose layout is fixed by the hash above.
          $command = Join-Path $destination 'FreeCAD_1.1.4-Windows-x86_64-py311/bin/freecadcmd.exe'
          if (-not (Test-Path -Path $command -PathType Leaf)) {
            throw "FreeCAD console executable missing from pinned archive: $command"
          }
          "cmd=$command" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build, install, and qualify the Windows handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $addon = Join-Path $env:GITHUB_WORKSPACE '_freecad_legacy_addon'
          if ((git -C $addon rev-parse HEAD) -ne 'e060ef0d8fe7143c2e0ce34734b686ba073f3cc1') {
            throw 'Unexpected legacy DXF importer revision'
          }
          git -C $addon diff --quiet HEAD -- dxfReader.py dxfLibrary.py dxfColorMap.py dxfImportObjects.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy DXF importer files differ from the pinned revision' }
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DLIBDXFRW_BUILD_DOC=OFF `
            -DLIBDXFRW_BUILD_DWG2DXF=ON `
            -DLIBDXFRW_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf libdxfrw_dwg_local_roundtrip libdxfrw_batch_output_names_tests libdxfrw_consumer_cxx17_contract
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed: $LASTEXITCODE" }
          $prefix = Join-Path $env:RUNNER_TEMP 'libdxfrw install'
          cmake --install build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed: $LASTEXITCODE" }
          $installed = Join-Path $prefix 'bin/dwg2dxf.exe'
          cmake -S . -B build `
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_LINE_CONTROL=ON `
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_PRIMITIVE_CONTROL=ON `
            -DLIBDXFRW_ENABLE_FREECAD_LEGACY_POLYFACE_CONTROL=ON `
            "-DLIBDXFRW_FREECAD_LEGACY_DXF_ADDON_DIR=$addon" `
            "-DLIBDXFRW_FREECADCMD_EXECUTABLE=${{ steps.freecad.outputs.cmd }}" `
            "-DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE=$installed"
          if ($LASTEXITCODE -ne 0) { throw "CMake reconfigure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf
          if ($LASTEXITCODE -ne 0) { throw "CMake rebuild failed: $LASTEXITCODE" }
          ctest --test-dir build -C Release `
            -R '^(dwg2dxf_freecad_(generated_ac1021_(line|primitives)_.*|generated_ac1024_primitives_.*|generated_ac1032_primitives_.*|legacy_polyface(_ac1024|_ac1032)?_(open|insert)|cli_compat|installed_cli_compat)|libdxfrw_batch_output_names)$' `
            --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw "FreeCAD CTest qualification failed: $LASTEXITCODE" }

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  candidate-headless:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate }}
    name: FreeCAD candidate headless / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Check out libdxfrw qualification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use repository line endings for the candidate checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure checkout line endings' }

      - name: Check out pinned FreeCAD and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeCAD/FreeCAD
          ref: 157bfcb7462a733b03a7d041aeaa79fee7aff7a3
          path: _freecad_candidate
          submodules: recursive
          persist-credentials: false

      - name: Verify source and apply candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '_freecad_candidate'
          $evidence = Join-Path $env:RUNNER_TEMP 'freecad-candidate-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $modules = @(git -C $source submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or $modules.Count -lt 5 -or @($modules | Where-Object { $_ -match '^[-+U]' }).Count -ne 0) {
            throw 'FreeCAD submodules do not match their recorded gitlinks'
          }
          $modules | Out-File -FilePath (Join-Path $evidence 'submodules.txt') -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP 'freecad-157.tar.gz'
          Invoke-WebRequest -Uri 'https://codeload.github.com/FreeCAD/FreeCAD/tar.gz/157bfcb7462a733b03a7d041aeaa79fee7aff7a3' -OutFile $archive
          python (Join-Path $env:GITHUB_WORKSPACE 'tools/research/apply_freecad_import_candidate.py') --source-root $source --source-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Candidate replay or application failed' }

      - name: Install pinned FreeCAD build environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          working-directory: _freecad_candidate
          cache: false
          locked: true

      - name: Build and probe the candidate
        shell: pwsh
        working-directory: _freecad_candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'freecad-candidate-build'
          $preset = if ($env:RUNNER_OS -eq 'Windows') { 'conda-windows-release' } else { 'conda-linux-release' }
          $configureArgs = @('--preset', $preset, '-B', $build)
          if ($env:RUNNER_OS -eq 'Windows') { $configureArgs += @('-DCMAKE_GENERATOR_PLATFORM=', '-DCMAKE_GENERATOR_TOOLSET=') }
          pixi run cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate configuration failed' }
          pixi run cmake --build $build --parallel 2 --target FreeCADMainCmd Import ImportScripts ImportPy Part PartScripts
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $name = if ($env:RUNNER_OS -eq 'Windows') { 'FreeCADCmd.exe' } else { 'FreeCADCmd' }
          $command = Join-Path (Join-Path $build 'bin') $name
          $source = Join-Path $env:GITHUB_WORKSPACE '_freecad_candidate'
          $archive = Join-Path $env:RUNNER_TEMP 'freecad-157.tar.gz'
          $evidence = Join-Path $env:RUNNER_TEMP 'freecad-candidate-evidence'
          pixi run python (Join-Path $env:GITHUB_WORKSPACE 'tools/research/run_freecad_candidate_probe.py') `
            --source-archive $archive --expected-source-commit 157bfcb7462a733b03a7d041aeaa79fee7aff7a3 `
            --require-git-base --source-root $source --build-root $build --freecadcmd $command --output-dir $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Candidate headless probe failed' }

      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-candidate-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freecad-candidate-evidence
          if-no-files-found: warn
          retention-days: 14
