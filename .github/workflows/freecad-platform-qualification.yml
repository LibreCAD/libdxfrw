name: FreeCAD native platform qualification

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/freecad-platform-qualification-*'

permissions:
  contents: read

jobs:
  linux-freecad:
    name: FreeCAD 1.1.4 / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify pinned FreeCAD release
        shell: bash
        run: |
          set -euo pipefail
          asset=FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          url="https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/${asset}"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' \
            f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434 \
            "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && ./"$asset" --appimage-extract)
          mapfile -t commands < <(find "$RUNNER_TEMP/squashfs-root" \
            \( -type f -o -type l \) -iname freecadcmd -print)
          if [[ "${#commands[@]}" -ne 1 ]]; then
            printf 'Expected one FreeCADCmd in the pinned AppImage, found %s\n' "${#commands[@]}" >&2
            exit 1
          fi
          printf 'cmd=%s\n' "${commands[0]}" >> "$GITHUB_OUTPUT"
        id: freecad

      - name: Build, install, and qualify the Linux handoff
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBDXFRW_BUILD_DOC=OFF \
            -DLIBDXFRW_BUILD_DWG2DXF=ON \
            -DLIBDXFRW_BUILD_TESTS=ON
          cmake --build build --parallel 2 --target dwg2dxf libdxfrw_dwg_local_roundtrip
          cmake --install build --prefix "$RUNNER_TEMP/libdxfrw install"
          installed="$RUNNER_TEMP/libdxfrw install/bin/dwg2dxf"
          cmake -S . -B build \
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_LINE_CONTROL=ON \
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_PRIMITIVE_CONTROL=ON \
            -DLIBDXFRW_FREECADCMD_EXECUTABLE='${{ steps.freecad.outputs.cmd }}' \
            -DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE="$installed"
          cmake --build build --parallel 2 --target dwg2dxf
          ctest --test-dir build \
            -R '^dwg2dxf_freecad_(generated_ac1021_(line|primitives)_.*|generated_ac1024_primitives_.*|generated_ac1032_primitives_.*|cli_compat|installed_cli_compat)$' \
            --output-on-failure --verbose

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  windows-freecad:
    name: FreeCAD 1.1.4 / Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify, and unpack pinned FreeCAD release
        id: freecad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'FreeCAD_1.1.4-Windows-x86_64-py311.7z'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '4828741fc91ee37fafcdb97a1abacb18b04ba451ac4372d9ff7a7349b36f4d6d'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FreeCAD archive SHA-256 mismatch: $actual != $expected"
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found: $sevenZip" }
          $destination = Join-Path $env:RUNNER_TEMP 'FreeCAD 1.1.4'
          New-Item -ItemType Directory -Path $destination | Out-Null
          & $sevenZip x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed: $LASTEXITCODE" }
          # The pinned archive also contains a root launcher. Use the actual
          # console executable in bin, whose layout is fixed by the hash above.
          $command = Join-Path $destination 'FreeCAD_1.1.4-Windows-x86_64-py311/bin/freecadcmd.exe'
          if (-not (Test-Path -Path $command -PathType Leaf)) {
            throw "FreeCAD console executable missing from pinned archive: $command"
          }
          "cmd=$command" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build, install, and qualify the Windows handoff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DLIBDXFRW_BUILD_DOC=OFF `
            -DLIBDXFRW_BUILD_DWG2DXF=ON `
            -DLIBDXFRW_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf libdxfrw_dwg_local_roundtrip libdxfrw_batch_output_names_tests libdxfrw_consumer_cxx17_contract
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed: $LASTEXITCODE" }
          $prefix = Join-Path $env:RUNNER_TEMP 'libdxfrw install'
          cmake --install build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed: $LASTEXITCODE" }
          $installed = Join-Path $prefix 'bin/dwg2dxf.exe'
          cmake -S . -B build `
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_LINE_CONTROL=ON `
            -DLIBDXFRW_ENABLE_FREECAD_GENERATED_AC1021_PRIMITIVE_CONTROL=ON `
            "-DLIBDXFRW_FREECADCMD_EXECUTABLE=${{ steps.freecad.outputs.cmd }}" `
            "-DLIBDXFRW_FREECAD_DWG2DXF_EXECUTABLE=$installed"
          if ($LASTEXITCODE -ne 0) { throw "CMake reconfigure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2 --target dwg2dxf
          if ($LASTEXITCODE -ne 0) { throw "CMake rebuild failed: $LASTEXITCODE" }
          ctest --test-dir build -C Release `
            -R '^(dwg2dxf_freecad_(generated_ac1021_(line|primitives)_.*|generated_ac1024_primitives_.*|generated_ac1032_primitives_.*|cli_compat|installed_cli_compat)|libdxfrw_batch_output_names)$' `
            --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw "FreeCAD CTest qualification failed: $LASTEXITCODE" }

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-platform-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
